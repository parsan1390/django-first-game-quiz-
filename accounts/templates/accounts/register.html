{% extends 'base.html' %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10">
  <div class="bg-slate-900/70 backdrop-blur border border-slate-800 rounded-2xl p-8 shadow-2xl shadow-cyan-900/20">
    <h1 class="text-2xl font-bold text-white mb-6 text-center">🚀 Create an Account</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for field in form %}
        <div>
          {{ field }}
          {% if field.errors %}
            <p class="text-red-400 text-xs mt-1">{{ field.errors|striptags }}</p>
          {% endif %}
        </div>
      {% endfor %}
      <button type="submit"
              class="w-full py-3 rounded-xl bg-gradient-to-l from-fuchsia-600 to-cyan-500 text-white font-bold hover:opacity-90 transition">
        Sign Up
      </button>
    </form>
    <p class="text-slate-400 text-sm mt-6 text-center">
      Already have an account? <a href="{% url 'accounts:login' %}" class="text-cyan-400 hover:underline">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
